name: Deploy → Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build (SPA estático)
        run: bun run build

      - name: Prepare deploy folder
        run: |
          set -e
          test -f dist/client/_shell.html
          mkdir -p deploy
          cp -r dist/client/. deploy/
          # O Apache serve o shell do SPA como index.html
          mv deploy/_shell.html deploy/index.html
          printf '%s\n' \
            'Options -MultiViews' \
            'RewriteEngine On' \
            'RewriteBase /' \
            '' \
            'RewriteCond %{REQUEST_FILENAME} -f [OR]' \
            'RewriteCond %{REQUEST_FILENAME} -d' \
            'RewriteRule ^ - [L]' \
            '' \
            'RewriteRule ^ /index.html [L]' \
            > deploy/.htaccess
          echo "Deploy folder ready:"; find deploy -type f | wc -l

      - name: Create ZIP
        run: cd deploy && zip -rq ../deploy.zip .

      - name: Upload ZIP ao servidor via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 185.245.180.223
          port: 65002
          username: u926853941
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          source: deploy.zip
          target: /home/u926853941/domains/interativo.vpsistema.com/

      - name: Extrair e ativar no servidor
        uses: appleboy/ssh-action@v1
        with:
          host: 185.245.180.223
          port: 65002
          username: u926853941
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          script: |
            set -e
            BASE=~/domains/interativo.vpsistema.com
            PUBDIR=$BASE/public_html
            ZIPFILE=$BASE/deploy.zip
            STAGE=$BASE/deploy_staging
            # Extrai primeiro num diretório temporário: se o ZIP estiver
            # corrompido, o site no ar não é apagado.
            rm -rf $STAGE && mkdir -p $STAGE
            unzip -q $ZIPFILE -d $STAGE
            test -f $STAGE/index.html
            cp $PUBDIR/index.html $BASE/index.html.bak 2>/dev/null || true
            find $PUBDIR -mindepth 1 -delete
            cp -a $STAGE/. $PUBDIR/
            rm -rf $STAGE $ZIPFILE
            echo "Deploy concluido: $(date)"
            ls $PUBDIR
